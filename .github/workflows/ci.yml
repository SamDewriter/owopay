# CI is switched on in Week 8: replace the `on:` block with pull_request and push to main,
# then make `ci` a required check on main. Until then it runs only when started by hand.
name: ci

on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cp .env.example .env
      - run: make lint
      - run: make test
