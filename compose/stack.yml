# The OwoPay services, included by ../docker-compose.yml with versions.env and .env.
# Paths here are relative to this folder. Run everything through the Makefile or plain
# `docker compose` from the repo root; the core profile is always started by make.
# Images come from versions.env; credentials and ports from .env.

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE}
  profiles: [orchestration]
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    # Local course stack: no login screen. Never do this on a shared server.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: owopay-course-jwt-secret
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    # The rest of the stack, as seen from inside the compose network
    OWOPAY_PG_HOST: postgres
    OWOPAY_KAFKA_BOOTSTRAP: redpanda:29092
    OWOPAY_S3_ENDPOINT: http://seaweedfs:8333
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  # ---------------------------------------------------------------- core (2.75 GB)
  postgres:
    image: ${POSTGRES_IMAGE}
    profiles: [core]
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      # On from day one so Week 7 can add CDC without a restart
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    ports: ["${PG_PORT}:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped

  redpanda:
    image: ${REDPANDA_IMAGE}
    profiles: [core]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      # Leaves headroom inside the 1 GB container limit
      - --memory=768M
      - --reserve-memory=0M
      - --overprovisioned
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
      - --schema-registry-addr=internal://0.0.0.0:28081,external://0.0.0.0:8081
      - --pandaproxy-addr=internal://0.0.0.0:28082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:28082,external://localhost:18082
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "9092:9092"
      - "8081:8081"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped

  redpanda-console:
    image: ${REDPANDA_CONSOLE_IMAGE}
    profiles: [core]
    environment:
      KAFKA_BROKERS: redpanda:29092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:28081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports: ["8082:8080"]
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE}
    profiles: [core]
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      # Small volumes so a laptop disk is not pre-claimed
      - -master.volumeSizeLimitMB=512
      - -volume.max=0
    ports:
      - "8333:8333" # S3 API
      - "8888:8888" # filer and file browser
      - "9333:9333" # master UI
    volumes:
      - seaweedfs_data:/data
      - ../seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped

  # ---------------------------------------------------------------- orchestration (3 GB)
  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate && airflow version"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    mem_limit: 512m
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    mem_limit: 512m
    restart: unless-stopped

  # ---------------------------------------------------------------- compute (2.5 GB, Week 6)
  spark-master:
    image: ${SPARK_IMAGE}
    profiles: [compute]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--webui-port", "8084"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "7077:7077"
      - "8084:8084"
    mem_limit: 512m
    restart: unless-stopped

  spark-worker:
    image: ${SPARK_IMAGE}
    profiles: [compute]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
              "--cores", "2", "--memory", "1g"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    depends_on: [spark-master]
    mem_limit: 1536m
    restart: unless-stopped

  # ---------------------------------------------------------------- serving (1 GB, Week 9)
  metabase:
    image: ${METABASE_IMAGE}
    profiles: [serving]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${PG_USER}
      MB_DB_PASS: ${PG_PASSWORD}
      MB_DB_HOST: postgres
      JAVA_OPTS: -Xmx768m
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped

  # ---------------------------------------------------------------- observe (0.5 GB, Week 12)
  statsd-exporter:
    image: ${STATSD_EXPORTER_IMAGE}
    profiles: [observe]
    ports:
      - "9102:9102"
      - "9125:9125/udp"
    mem_limit: 128m
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    profiles: [observe]
    volumes:
      - ../observe/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    mem_limit: 192m
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE}
    profiles: [observe]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ../observe/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3001:3000"]
    mem_limit: 192m
    restart: unless-stopped

volumes:
  pg_data:
  redpanda_data:
  seaweedfs_data:
  airflow_logs:
